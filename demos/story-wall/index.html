<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f3eb">
  <meta name="description" content="An interactive donation and community storytelling website prototype.">
  <title>Voices United — Hear our stories</title>
  <link rel="preload" href="assets/anton-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#stories">Skip to stories</a>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="#stories" aria-label="Voices United home">
        <svg class="brand-mark" viewBox="0 0 34 40" aria-hidden="true"><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 16v8M7 10v20M11 6v28M15 3v34M19 5v30M23 8v24M27 11v18M31 16v8"/></g></svg>
        <span>VOICES UNITED</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <button type="button" data-panel="programs">Programs</button>
        <button type="button" data-panel="advocacy">Blog & advocacy</button>
        <a href="#stories" aria-current="page">Stories</a>
        <button type="button" data-panel="contact">Contact</button>
      </nav>
      <div class="header-actions">
        <span class="language" aria-label="Page language: English" title="Page language: English"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="3.5" ry="8.5"/><path d="M3.5 12h17"/></svg><span>EN</span></span>
        <button class="button button-outline donate-nav" type="button" data-panel="donate">Donate</button>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
      </div>
    </header>
    <nav id="mobile-menu" class="mobile-menu" aria-label="Mobile navigation" hidden>
      <button type="button" data-panel="programs">Programs</button><button type="button" data-panel="advocacy">Blog & advocacy</button><a href="#stories">Stories</a><button type="button" data-panel="contact">Contact</button>
    </nav>
    <main>
      <section class="stories-section" id="stories" aria-labelledby="hero-title">
        <div class="intro">
          <h1 id="hero-title">HEAR OUR <span>STORIES</span></h1>
          <p>Real change begins with a human connection.<br> Meet the voices at the heart of a more hopeful world.</p>
        </div>
        <div class="story-gallery" aria-label="Community story gallery"></div>
        <div class="gallery-bottom">
          <p class="mobile-hint">Swipe to meet our community <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-5-5 5 5-5 5"/></svg></p>
          <div class="main-actions">
            <button class="button button-orange" type="button" data-panel="share">Tell my story</button>
            <button class="button button-outline" type="button" data-panel="all">See all stories</button>
          </div>
        </div>
      </section>
      <section class="content-panel" id="explore" aria-labelledby="panel-heading" hidden>
        <div class="panel-top"><h2 id="panel-heading" tabindex="-1"></h2><button class="close-panel" type="button" aria-label="Close section"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
        <div id="panel-content"></div>
      </section>
    </main>
    <footer class="site-footer"><span>Every voice matters. Every story connects us.</span><span>Design prototype · Fictional stories & illustrative photos</span></footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
